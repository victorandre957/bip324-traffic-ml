[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bip324-traffic-ml"
version = "0.1.0"
description = "Supervised baselines for passive BIP324 traffic analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
]

[project.scripts]
bip324-traffic-ml = "bip324_traffic_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
bip324_traffic_ml = ["py.typed"]
